development:
  live_games:
    class: LiveGamesJob
    schedule: every 2 minutes
  seed_teams:
    class: TeamsJob
    schedule: "0 2 1 * *"
  seed_venues:
    class: VenuesJob
    schedule: "0 3 1 * *"
  seed_games:
    class: GamesJob
    schedule: "30 * * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  live_games:
    class: LiveGamesJob
    schedule: every 20 seconds
  seed_teams:
    class: TeamsJob
    schedule: "0 2 1 * *"
  seed_venues:
    class: VenuesJob
    schedule: "0 3 1 * *"
  seed_games:
    class: GamesJob
    schedule: "30 * * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
